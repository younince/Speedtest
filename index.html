<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공지사항 영역</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="notice-section">
        <h2 class="notice-title">공지사항</h2>
        
        <div class="notice-container">
            <ul class="notice-list">
                <!-- 1. 중요 -->
                <li class="notice-item">
                    <div class="notice-left">
                        <span class="badge important">중요</span>
                        <span class="notice-text">2026년 WorldSkills 대회 일정 안내</span>
                    </div>
                    <span class="notice-date">2026-01-15</span>
                </li>
                <!-- 2. 공지 -->
                <li class="notice-item">
                    <div class="notice-left">
                        <span class="badge notice">공지</span>
                        <span class="notice-text">웹디자인 기술대회 참가신청 마감</span>
                    </div>
                    <span class="notice-date">2026-01-10</span>
                </li>
                <!-- 3. 안내 -->
                <li class="notice-item">
                    <div class="notice-left">
                        <span class="badge info">안내</span>
                        <span class="notice-text">온라인 교육과정 개설 안내</span>
                    </div>
                    <span class="notice-date">2026-01-08</span>
                </li>
                <!-- 4. 공지 -->
                <li class="notice-item">
                    <div class="notice-left">
                        <span class="badge notice">공지</span>
                        <span class="notice-text">2026년 1분기 교육일정 발표</span>
                    </div>
                    <span class="notice-date">2026-01-05</span>
                </li>
                <!-- 5. 안내 -->
                <li class="notice-item">
                    <div class="notice-left">
                        <span class="badge info">안내</span>
                        <span class="notice-text">홈페이지 점검 일정 안내</span>
                    </div>
                    <span class="notice-date">2026-01-03</span>
                </li>
            </ul>
        </div>
    </section>

</body>
</html>
